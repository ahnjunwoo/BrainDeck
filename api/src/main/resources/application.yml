spring:
  application:
    name: braindeck-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/braindeck}
    username: ${DB_USER:braindeck}
    password: ${DB_PASSWORD:braindeck}
  flyway:
    enabled: true
    locations: classpath:db/migration
braindeck:
  jobs:
    poll-interval-ms: 5000
    max-attempts: 3
    kinds: embed,enrich
